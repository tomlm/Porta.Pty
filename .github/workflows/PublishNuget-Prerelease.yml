name: Publish Nuget Prerelease

# A clone of PublishNuget.yml that publishes the SAME build under a prerelease version, so a package
# can be consumed for real -- restored from nuget.org, resolved through runtimes/, staged through
# buildTransitive/ -- before the version consumers get is spent.
#
# That gap is worth closing here specifically: the test suite references the library by PROJECT and so
# cannot observe any packaging behaviour at all. scripts/verify-consumer.sh and
# Verify-ConPtyConsumerStaging.ps1 close most of it from a LOCAL feed; a prerelease closes the rest.
#
# The only differences from PublishNuget.yml are the version and fail-if-exists. Everything else is
# deliberately identical, because a prerelease that is built differently from the release is not a
# test of the release.
#
# The version auto-increments -- 2.0.0-rc001, rc002, ... -- so this can be run as many times as it
# takes without picking a number by hand or colliding with one already spent.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Prerelease label. The counter is per-label and advances on its own (2.0.0 -> 2.0.0-rc001, rc002, ...)'
        required: true
        default: 'rc'
        type: string

jobs:
  # Build native shim on Linux x64
  build-native-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Built on glibc 2.28 so the shim loads on RHEL 8. glibc 2.34 folded libutil into libc
      # and re-versioned forkpty, which is the only symbol that was forcing a modern floor.
      - name: Build native PTY shim (glibc 2.28 container)
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -c '
            set -e
            dnf install -y -q gcc cmake make
            cd src/Porta.Pty.Native
            chmod +x build.sh
            ./build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" src/Porta.Pty.Native/output || true

      # Asserted, or a future runner or base-image bump raises it again unnoticed, as 2.34 was.
      - name: Assert the glibc floor
        run: |
          so=$(find src/Porta.Pty.Native/output -name 'libporta_pty.so' | head -1)
          echo "checking $so"
          readelf -V "$so" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -1
          if readelf --dyn-syms "$so" | grep -qE 'GLIBC_2\.(3[0-9]|[4-9][0-9])'; then
            echo "::error::shim requires a glibc newer than 2.28; RHEL 8 cannot load it"
            readelf --dyn-syms "$so" | grep -E 'GLIBC_2\.(3[0-9]|[4-9][0-9])'
            exit 1
          fi
          echo "no symbol above glibc 2.29 -- loads on RHEL 8"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native/libporta_pty.so

  # Build native shim on Linux ARM64
  build-native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Built on glibc 2.28 so the shim loads on RHEL 8. glibc 2.34 folded libutil into libc
      # and re-versioned forkpty, which is the only symbol that was forcing a modern floor.
      - name: Build native PTY shim (glibc 2.28 container)
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -c '
            set -e
            dnf install -y -q gcc cmake make
            cd src/Porta.Pty.Native
            chmod +x build.sh
            ./build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" src/Porta.Pty.Native/output || true

      # Asserted, or a future runner or base-image bump raises it again unnoticed, as 2.34 was.
      - name: Assert the glibc floor
        run: |
          so=$(find src/Porta.Pty.Native/output -name 'libporta_pty.so' | head -1)
          echo "checking $so"
          readelf -V "$so" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -1
          if readelf --dyn-syms "$so" | grep -qE 'GLIBC_2\.(3[0-9]|[4-9][0-9])'; then
            echo "::error::shim requires a glibc newer than 2.28; RHEL 8 cannot load it"
            readelf --dyn-syms "$so" | grep -E 'GLIBC_2\.(3[0-9]|[4-9][0-9])'
            exit 1
          fi
          echo "no symbol above glibc 2.29 -- loads on RHEL 8"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native/libporta_pty.so

  # Build native shim on macOS (builds BOTH x64 and arm64 via cross-compilation)
  build-native-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native PTY shim (both architectures)
        run: |
          cd src/Porta.Pty.Native
          chmod +x build.sh
          ./build.sh

      - name: Upload macOS ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Porta.Pty.Native/output/runtimes/osx-arm64/native/libporta_pty.dylib

      - name: Upload macOS x64 native library
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-x64
          path: src/Porta.Pty.Native/output/runtimes/osx-x64/native/libporta_pty.dylib

  # Package and publish NuGet
  package-and-publish:
    runs-on: ubuntu-latest
    needs:
      - build-native-linux-x64
      - build-native-linux-arm64
      - build-native-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Download all native libraries
      - name: Download Linux x64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native/

      - name: Download Linux ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native/

      - name: Download macOS ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Porta.Pty.Native/output/runtimes/osx-arm64/native/

      - name: Download macOS x64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/Porta.Pty.Native/output/runtimes/osx-x64/native/

      - name: List native libraries
        run: |
          echo "Native libraries included in package:"
          find src/Porta.Pty.Native/output/runtimes -type f -name "*.so" -o -name "*.dylib"

      # The base version is READ from the csproj rather than taken as an input, so a prerelease can
      # never be published for a version the branch does not actually declare -- which is the one way
      # a "test the package before the real push" step could test the wrong thing entirely.
      #
      # The counter comes from nuget.org rather than from github.run_number, which would skip and
      # would restart at nothing to do with the versions actually published. The question being asked
      # is "what is the next unused 2.0.0-rc*", and only nuget.org knows that.
      #
      # rc001, NOT rc.001. SemVer forbids leading zeroes in a DOTTED numeric identifier, and NuGet
      # enforces it: `2.0.0-rc.001` fails to pack outright with "is not a valid version string".
      # Without the dot the whole label is one alphanumeric identifier, which is legal and which also
      # keeps the padding meaningful -- these sort lexically, so rc009 < rc010 only because of it.
      - name: Compute the next prerelease version
        id: version
        run: |
          set -euo pipefail
          label='${{ inputs.label }}'

          # Must not END in a digit, or the label and the counter run together and the next lookup
          # cannot tell where one stops: rc1 + 002 is rc1002, which reads back as label rc, counter
          # 1002. Rejecting here beats discovering it two prereleases later.
          if ! printf '%s' "$label" | grep -qE '^[0-9A-Za-z-]*[A-Za-z-]$'; then
            echo "::error::'$label' must be alphanumerics or hyphens and must not end in a digit"
            exit 1
          fi

          csproj=src/Porta.Pty/Porta.Pty.csproj
          base=$(grep -oP '(?<=<Version>)[^<]+' "$csproj" | head -1)
          if [ -z "$base" ]; then
            echo "::error::no <Version> element in $csproj"
            exit 1
          fi

          # Flat container, which lists every version of the id in lowercase. A 404 means the id has
          # never been published at all, which is a legitimate answer of "none". Anything else is the
          # API failing, and guessing 001 through a failed lookup would republish over real versions.
          index="https://api.nuget.org/v3-flatcontainer/porta.pty/index.json"
          status=$(curl -sS -o versions.json -w '%{http_code}' "$index" || echo 000)

          case "$status" in
            200) ;;
            404) echo '{"versions":[]}' > versions.json ;;
            *) echo "::error::nuget.org returned $status for $index"; exit 1 ;;
          esac

          # Prefix match plus an all-digits tail, rather than a regex built out of $base -- the base
          # version contains dots, and the escaping is one more thing to get wrong silently. Unlisted
          # versions are still listed here, which is correct: they occupy the number either way.
          prefix="$base-$label"
          latest=$(jq -r '.versions[]' versions.json \
            | awk -v p="$prefix" 'index($0, p) == 1 {
                  tail = substr($0, length(p) + 1)
                  if (tail ~ /^[0-9]+$/) { print tail + 0 }
                }' \
            | sort -n | tail -1)

          # 10# forces base 10. Without it $(( 008 + 1 )) is a fatal "value too great for base",
          # because the padding that makes these sort makes them look octal to the shell.
          next=$(printf '%03d' "$(( 10#${latest:-0} + 1 ))")

          echo "version=$prefix$next" >> "$GITHUB_OUTPUT"
          echo "release version in $csproj: $base"
          echo "highest published $prefix*: ${latest:-none}"
          echo "publishing: $prefix$next"

      - name: Restore dependencies
        run: dotnet restore src/Porta.Pty.sln

      # PackageVersion, NOT Version: it moves the package version alone and leaves AssemblyVersion and
      # FileVersion where the csproj put them, so the prerelease assembly is binary-identical to the
      # release one. Version would drag all three along and make them different builds -- which would
      # mean the thing being tested is not the thing being shipped.
      #
      # Passed to BUILD as well as pack, because GeneratePackageOnBuild is on: the build produces a
      # package too, and `pack --no-build` reuses what the build laid down. Passing it to only one of
      # the two is how the two disagree.
      - name: Build
        run: dotnet build src/Porta.Pty.sln -c Release --no-restore -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: dotnet pack
        run: |
          dotnet pack --no-build src/Porta.Pty.sln -c Release -o packages --include-symbols --property WarningLevel=0 -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: List package contents
        run: |
          echo "Packages:"
          ls -l packages
          echo "Package contents:"
          unzip -l packages/*.nupkg | grep -E "(runtimes|\.so|\.dylib)"

      # fail-if-exists is TRUE here, where PublishNuget.yml has it false, and the difference matters
      # precisely because this workflow picks its own version. The counter is read from nuget.org, and
      # nuget.org takes a minute or two to index a push -- so two runs in quick succession can both
      # compute the same number. Swallowing that would report a successful publish of a package that
      # was never uploaded, and the whole point here is to test what actually got published. Failing
      # loudly costs a re-run, by which time the index has caught up.
      - name: Publish NuGet and symbols
        id: nuget-push
        uses: edumserrano/nuget-push@v1
        with:
          api-key: '${{ secrets.NUGET_KEY }}'
          working-directory: 'packages'
          fail-if-exists: true

      - name: Summary
        run: |
          version='${{ steps.version.outputs.version }}'
          {
            echo "### Published \`Porta.Pty $version\`"
            echo
            echo "Consume it with an explicit version -- NuGet does not resolve prereleases otherwise:"
            echo '```'
            echo "dotnet add package Porta.Pty --version $version"
            echo '```'
            echo
            echo "The next run of this workflow takes the next number on its own. It may need a minute"
            echo "or two first: the counter comes from nuget.org, which does not index a push instantly."
          } >> "$GITHUB_STEP_SUMMARY"
