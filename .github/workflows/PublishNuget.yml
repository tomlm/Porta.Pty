name: Publish Nuget

on:
  workflow_dispatch:

jobs:
  # Build native shim on Linux x64
  build-native-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # Built inside AlmaLinux 8 (glibc 2.28) rather than on the runner. glibc 2.34 folded
      # libutil into libc and gave forkpty a new symbol version, so anything compiled on a
      # modern runner demands forkpty@GLIBC_2.34 and will not LOAD on RHEL 8 and its
      # derivatives -- which .NET 10 supports. Nothing here needs a recent glibc: built this
      # way the floor is GLIBC_2.14, and binaries built against an old glibc run fine on new
      # ones. Measured both directions before making this change.
      - name: Build native PTY shim (glibc 2.28 container)
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -c '
            set -e
            dnf install -y -q gcc cmake make
            cd src/Porta.Pty.Native
            chmod +x build.sh
            ./build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" src/Porta.Pty.Native/output || true

      # The floor is the whole point of the step above, so it is asserted rather than assumed.
      # Without this, a future runner or base-image bump raises it again silently -- which is
      # exactly how it reached 2.34 unnoticed and stayed there since 1.0.7.
      - name: Assert the glibc floor
        run: |
          so=$(find src/Porta.Pty.Native/output -name 'libporta_pty.so' | head -1)
          echo "checking $so"
          highest=$(readelf -V "$so" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -1)
          echo "highest required glibc: $highest"
          readelf --dyn-syms "$so" | grep -E 'GLIBC_2\.(3[0-9]|[4-9][0-9])' \
            && { echo "::error::shim requires a glibc newer than 2.28; RHEL 8 cannot load it"; exit 1; } \
            || echo "no symbol above glibc 2.29 -- loads on RHEL 8"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native/libporta_pty.so

  # Build native shim on Linux ARM64
  build-native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # Built inside AlmaLinux 8 (glibc 2.28) rather than on the runner. glibc 2.34 folded
      # libutil into libc and gave forkpty a new symbol version, so anything compiled on a
      # modern runner demands forkpty@GLIBC_2.34 and will not LOAD on RHEL 8 and its
      # derivatives -- which .NET 10 supports. Nothing here needs a recent glibc: built this
      # way the floor is GLIBC_2.14, and binaries built against an old glibc run fine on new
      # ones. Measured both directions before making this change.
      - name: Build native PTY shim (glibc 2.28 container)
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -c '
            set -e
            dnf install -y -q gcc cmake make
            cd src/Porta.Pty.Native
            chmod +x build.sh
            ./build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" src/Porta.Pty.Native/output || true

      # The floor is the whole point of the step above, so it is asserted rather than assumed.
      # Without this, a future runner or base-image bump raises it again silently -- which is
      # exactly how it reached 2.34 unnoticed and stayed there since 1.0.7.
      - name: Assert the glibc floor
        run: |
          so=$(find src/Porta.Pty.Native/output -name 'libporta_pty.so' | head -1)
          echo "checking $so"
          highest=$(readelf -V "$so" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -1)
          echo "highest required glibc: $highest"
          readelf --dyn-syms "$so" | grep -E 'GLIBC_2\.(3[0-9]|[4-9][0-9])' \
            && { echo "::error::shim requires a glibc newer than 2.28; RHEL 8 cannot load it"; exit 1; } \
            || echo "no symbol above glibc 2.29 -- loads on RHEL 8"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native/libporta_pty.so

  # Build native shim on macOS (builds BOTH x64 and arm64 via cross-compilation)
  build-native-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Build native PTY shim (both architectures)
        run: |
          cd src/Porta.Pty.Native
          chmod +x build.sh
          ./build.sh

      - name: Upload macOS ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Porta.Pty.Native/output/runtimes/osx-arm64/native/libporta_pty.dylib

      - name: Upload macOS x64 native library
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-x64
          path: src/Porta.Pty.Native/output/runtimes/osx-x64/native/libporta_pty.dylib

  # Package and publish NuGet
  package-and-publish:
    runs-on: ubuntu-latest
    needs: 
      - build-native-linux-x64
      - build-native-linux-arm64
      - build-native-macos
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Download all native libraries
      - name: Download Linux x64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/Porta.Pty.Native/output/runtimes/linux-x64/native/

      - name: Download Linux ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Porta.Pty.Native/output/runtimes/linux-arm64/native/

      - name: Download macOS ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Porta.Pty.Native/output/runtimes/osx-arm64/native/

      - name: Download macOS x64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/Porta.Pty.Native/output/runtimes/osx-x64/native/

      - name: List native libraries
        run: |
          echo "Native libraries included in package:"
          find src/Porta.Pty.Native/output/runtimes -type f -name "*.so" -o -name "*.dylib"

      - name: Restore dependencies
        run: dotnet restore src/Porta.Pty.sln

      - name: Build
        run: dotnet build src/Porta.Pty.sln -c Release --no-restore 
  
      - name: dotnet pack 
        run: |
          dotnet pack --no-build src/Porta.Pty.sln -c Release -o packages --include-symbols --property WarningLevel=0

      - name: List package contents
        run: |
          echo "Package contents:"
          unzip -l packages/*.nupkg | grep -E "(runtimes|\.so|\.dylib)"

      - name: Publish NuGet and symbols
        id: nuget-push
        uses: edumserrano/nuget-push@v1
        with:
          api-key: '${{ secrets.NUGET_KEY }}' 
          working-directory: 'packages'
          fail-if-exists: false
